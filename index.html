<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>CyberGuard Inventory | Nexus 2030</title>
  <!-- Chart.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <!-- Font Awesome 6 (free icons) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', system-ui, 'Segoe UI', 'Poppins', sans-serif;
    }

    body {
      background: radial-gradient(circle at 10% 20%, #0a0f1e, #03050b);
      color: #eef5ff;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* animated grid background */
    .cyber-grid {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: 
        linear-gradient(rgba(0, 255, 255, 0.08) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 255, 255, 0.08) 1px, transparent 1px);
      background-size: 45px 45px;
      pointer-events: none;
      z-index: 0;
      animation: gridMove 25s linear infinite;
    }

    @keyframes gridMove {
      0% { transform: translate(0,0); }
      100% { transform: translate(45px,45px); }
    }

    /* glassmorphism & scrollbar */
    .glass-card {
      background: rgba(12, 20, 35, 0.55);
      backdrop-filter: blur(12px);
      border-radius: 32px;
      border: 1px solid rgba(0, 255, 255, 0.25);
      box-shadow: 0 15px 35px rgba(0,0,0,0.4), 0 0 12px rgba(0,255,255,0.2);
      transition: all 0.25s ease;
    }

    .glass-card:hover {
      border-color: cyan;
      box-shadow: 0 10px 28px rgba(0,255,255,0.3);
    }

    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: #0a0f1e; }
    ::-webkit-scrollbar-thumb { background: #0ff; border-radius: 10px; }

    /* toast & modal */
    .toast-notify {
      position: fixed;
      bottom: 25px;
      right: 25px;
      background: rgba(0,20,40,0.9);
      backdrop-filter: blur(12px);
      border-left: 4px solid cyan;
      color: white;
      padding: 12px 20px;
      border-radius: 28px;
      font-weight: 500;
      z-index: 2000;
      box-shadow: 0 0 12px cyan;
      animation: fadeSlide 0.3s ease;
    }

    @keyframes fadeSlide {
      from { opacity: 0; transform: translateX(30px); }
      to { opacity: 1; transform: translateX(0); }
    }

    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.7);
      backdrop-filter: blur(10px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 2100;
    }

    /* login specific */
    .login-wrapper {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      z-index: 2;
    }

    /* dashboard layout */
    .dashboard-container {
      display: flex;
      min-height: 100vh;
      position: relative;
      z-index: 2;
    }

    .sidebar {
      width: 280px;
      background: rgba(5, 10, 22, 0.75);
      backdrop-filter: blur(16px);
      border-right: 1px solid rgba(0,255,255,0.3);
      transition: all 0.3s;
      display: flex;
      flex-direction: column;
      padding: 24px 0;
    }

    .main-content {
      flex: 1;
      padding: 24px 28px;
      overflow-y: auto;
      max-height: 100vh;
    }

    .menu-item {
      padding: 12px 24px;
      margin: 6px 16px;
      border-radius: 28px;
      display: flex;
      align-items: center;
      gap: 14px;
      font-weight: 500;
      transition: all 0.2s;
      cursor: pointer;
      color: #ccc;
    }

    .menu-item i { width: 24px; }
    .menu-item.active, .menu-item:hover {
      background: rgba(0, 255, 255, 0.2);
      color: cyan;
      box-shadow: 0 0 6px cyan;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 28px;
      flex-wrap: wrap;
    }

    /* form styling */
    .form-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px,1fr));
      gap: 20px;
    }

    input, select, textarea {
      background: rgba(0,0,0,0.6);
      border: 1px solid #2c3e66;
      border-radius: 20px;
      padding: 12px 16px;
      color: white;
      width: 100%;
      outline: none;
      transition: 0.2s;
    }

    input:focus, select:focus, textarea:focus {
      border-color: cyan;
      box-shadow: 0 0 8px cyan;
    }

    button {
      background: linear-gradient(135deg, #00c6ff, #0072ff);
      border: none;
      padding: 10px 20px;
      border-radius: 40px;
      color: white;
      font-weight: bold;
      cursor: pointer;
      transition: 0.2s;
      box-shadow: 0 2px 8px rgba(0,114,255,0.4);
    }

    button:hover {
      transform: scale(1.02);
      box-shadow: 0 0 15px cyan;
    }

    .inventory-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
      overflow-x: auto;
      display: block;
    }

    .inventory-table th, .inventory-table td {
      padding: 14px 8px;
      border-bottom: 1px solid rgba(0,255,255,0.2);
      text-align: left;
    }

    .badge {
      background: #0a2a3b;
      border-radius: 40px;
      padding: 4px 12px;
      font-size: 12px;
      font-weight: 600;
    }

    .status-critical { color: #ff4d4d; text-shadow:0 0 2px red; }
    .status-high { color: #ffaa44; }

    @media (max-width: 800px) {
      .sidebar { width: 80px; }
      .sidebar span:not(.menu-icon) { display: none; }
      .menu-item { justify-content: center; }
      .main-content { padding: 16px; }
    }
  </style>
</head>
<body>
<div class="cyber-grid"></div>

<!-- LOGIN PAGE -->
<div id="loginPage" class="login-wrapper">
  <div class="glass-card" style="width: 420px; max-width: 90%; padding: 42px 32px; text-align: center;">
    <i class="fas fa-shield-halos" style="font-size: 60px; color: cyan; margin-bottom: 12px; filter: drop-shadow(0 0 8px cyan);"></i>
    <h2 style="margin-bottom: 28px;">CYBERGUARD NEXUS</h2>
    <form id="loginForm">
      <div style="margin-bottom: 20px; position: relative;">
        <i class="fas fa-user" style="position: absolute; left: 18px; top: 14px; color: cyan;"></i>
        <input type="text" id="username" placeholder="Username" style="padding-left: 44px;" autocomplete="off">
      </div>
      <div style="margin-bottom: 20px; position: relative;">
        <i class="fas fa-lock" style="position: absolute; left: 18px; top: 14px; color: cyan;"></i>
        <input type="password" id="password" placeholder="Password" style="padding-left: 44px;">
        <i class="fas fa-eye" id="togglePwd" style="position: absolute; right: 18px; top: 14px; cursor: pointer; color: gray;"></i>
      </div>
      <div style="display: flex; justify-content: space-between; margin-bottom: 28px;">
        <label><input type="checkbox" id="rememberMe"> Remember me</label>
      </div>
      <button type="submit" style="width: 100%; padding: 12px;">ACCESS TERMINAL</button>
      <div id="loginError" style="color: #ff5e7c; margin-top: 20px; font-size: 14px;"></div>
    </form>
  </div>
</div>

<!-- DASHBOARD CONTAINER (hidden initially) -->
<div id="dashboardApp" style="display: none;">
  <div class="dashboard-container">
    <div class="sidebar">
      <div style="padding: 0 20px 30px 20px; font-weight: bold; font-size: 22px; letter-spacing: 2px;"><i class="fas fa-shield-virus"></i> <span>CYBER<span style="color:cyan;">INV</span></span></div>
      <div class="menu-item active" data-page="dashboard"><i class="fas fa-tachometer-alt menu-icon"></i> <span>Dashboard</span></div>
      <div class="menu-item" data-page="addInventory"><i class="fas fa-plus-circle menu-icon"></i> <span>Add Inventory</span></div>
      <div class="menu-item" data-page="updateRecords"><i class="fas fa-edit menu-icon"></i> <span>Update Records</span></div>
      <div class="menu-item" data-page="reportsAnalytics"><i class="fas fa-chart-line menu-icon"></i> <span>Reports & Analytics</span></div>
      <div class="menu-item" data-page="activityLogs"><i class="fas fa-history menu-icon"></i> <span>Activity Logs</span></div>
      <div class="menu-item" data-page="settings"><i class="fas fa-cog menu-icon"></i> <span>Settings</span></div>
      <div class="menu-item" id="logoutBtn"><i class="fas fa-sign-out-alt menu-icon"></i> <span>Logout</span></div>
    </div>

    <div class="main-content">
      <div class="topbar">
        <div style="display: flex; gap: 15px; align-items: center; flex-wrap: wrap;">
          <div style="background: rgba(0,0,0,0.5); border-radius: 40px; padding: 6px 16px;"><i class="fas fa-search"></i> <input type="text" id="globalSearch" placeholder="Search inventory..." style="background: transparent; border: none; width: 180px;"></div>
          <div><i class="fas fa-bell"></i> <span style="background: cyan; color:black; border-radius: 50%; padding: 2px 6px; font-size: 10px;">3</span></div>
          <div><i class="fas fa-user-astronaut"></i> Admin</div>
          <div><i class="fas fa-shield-alt" style="color: #0f0;"></i> SECURE</div>
          <div id="liveDateTime" style="font-family: monospace;"></div>
        </div>
      </div>

      <!-- DYNAMIC PAGE CONTENT -->
      <div id="pageContainer"></div>
    </div>
  </div>
</div>

<script>
  // ---------- STORAGE KEYS ----------
  const STORAGE_KEY = 'cyber_inventory_db';
  const SESSION_KEY = 'cyber_auth';

  let inventoryItems = [];
  let currentEditId = null;
  let activityLogs = [];

  // Helper functions
  function saveToLocal() { localStorage.setItem(STORAGE_KEY, JSON.stringify(inventoryItems)); }
  function saveLogs() { localStorage.setItem('cyber_activity_logs', JSON.stringify(activityLogs)); }
  function loadLogs() { const logs = localStorage.getItem('cyber_activity_logs'); if(logs) activityLogs = JSON.parse(logs); }

  function addLog(action, details) {
    activityLogs.unshift({ timestamp: new Date().toISOString(), action, details });
    if(activityLogs.length > 200) activityLogs.pop();
    saveLogs();
  }

  function initInventory() {
    const stored = localStorage.getItem(STORAGE_KEY);
    if(stored) inventoryItems = JSON.parse(stored);
    else {
      inventoryItems = [
        { id: "INV-1001", name: "XDR Firewall", description: "Next-gen firewall", type: "Security Appliance", entryDate: "2025-02-10", quantity: 4, received: "Yes", priority: "Critical", vendor: "Palo Alto", serial: "SN-FW992", department: "Security Ops" },
        { id: "INV-1002", name: "Endpoint Suite", description: "Antivirus license", type: "Software", entryDate: "2025-01-15", quantity: 120, received: "Yes", priority: "High", vendor: "CrowdStrike", serial: "SW-EP001", department: "IT" },
      ];
      saveToLocal();
    }
    loadLogs();
  }

  // Helper notifications
  function showToast(msg, type = "info") {
    const toastDiv = document.createElement('div');
    toastDiv.className = 'toast-notify';
    toastDiv.innerHTML = `<i class="fas ${type === 'success' ? 'fa-check-circle' : 'fa-exclamation-triangle'}"></i> ${msg}`;
    document.body.appendChild(toastDiv);
    setTimeout(() => toastDiv.remove(), 2800);
  }

  // Generate Unique ID
  function generateItemId() { return "INV-" + Date.now().toString(36).toUpperCase(); }

  // Render Inventory Table (global search + pagination etc)
  let currentPage = 1;
  let rowsPerPage = 6;
  let currentFilter = "";

  function renderInventoryTable(containerId, searchTerm = "") {
    let filtered = [...inventoryItems];
    if(searchTerm) filtered = filtered.filter(i => i.name.toLowerCase().includes(searchTerm) || i.id.toLowerCase().includes(searchTerm) || i.serial?.toLowerCase().includes(searchTerm));
    const start = (currentPage-1)*rowsPerPage;
    const paginated = filtered.slice(start, start+rowsPerPage);
    let html = `<table class="inventory-table"><thead><tr><th>ID</th><th>Name</th><th>Type</th><th>Qty</th><th>Priority</th><th>Status</th><th>Actions</th></tr></thead><tbody>`;
    paginated.forEach(item => {
      html += `<tr style="transition:0.1s;">
        <td>${item.id}</td><td>${item.name}</td><td>${item.type}</td><td>${item.quantity}</td>
        <td class="${item.priority === 'Critical' ? 'status-critical' : (item.priority === 'High' ? 'status-high' : '')}">${item.priority}</td>
        <td><span class="badge">${item.received === "Yes" ? "✓ Received" : "Pending"}</span></td>
        <td><button class="edit-item-btn" data-id="${item.id}"><i class="fas fa-edit"></i></button> <button class="delete-item-btn" data-id="${item.id}"><i class="fas fa-trash"></i></button> <button class="view-item-btn" data-id="${item.id}"><i class="fas fa-eye"></i></button></td>
      </tr>`;
    });
    html += `</tbody></table><div style="margin-top:12px; display:flex; gap:12px; justify-content:flex-end;">`;
    if(currentPage > 1) html+= `<button id="prevPageBtn">Prev</button>`;
    if(start+rowsPerPage < filtered.length) html+= `<button id="nextPageBtn">Next</button>`;
    html+=`</div>`;
    document.getElementById(containerId).innerHTML = html;
    document.querySelectorAll('.edit-item-btn').forEach(btn => btn.addEventListener('click', (e) => { const id = btn.getAttribute('data-id'); loadItemToForm(id); showPage('addInventory'); }));
    document.querySelectorAll('.delete-item-btn').forEach(btn => btn.addEventListener('click', (e) => { const id = btn.getAttribute('data-id'); deleteItemWithConfirm(id); }));
    document.querySelectorAll('.view-item-btn').forEach(btn => btn.addEventListener('click', (e) => { const id = btn.getAttribute('data-id'); viewItemDetails(id); }));
    if(document.getElementById('prevPageBtn')) document.getElementById('prevPageBtn').onclick = () => { currentPage--; renderInventoryTable('inventoryDynamicContainer', currentFilter); };
    if(document.getElementById('nextPageBtn')) document.getElementById('nextPageBtn').onclick = () => { currentPage++; renderInventoryTable('inventoryDynamicContainer', currentFilter); };
  }

  function deleteItemWithConfirm(id) {
    const modal = document.createElement('div'); modal.className = 'modal-overlay';
    modal.innerHTML = `<div class="glass-card" style="padding:28px; max-width:400px;"><h3>⚠️ Terminate Asset?</h3><p>This action is irreversible.</p><div style="display:flex; gap:20px; margin-top:20px;"><button id="confirmDel">Yes, Delete</button><button id="cancelDel">Cancel</button></div></div>`;
    document.body.appendChild(modal);
    document.getElementById('confirmDel').onclick = () => {
      inventoryItems = inventoryItems.filter(i => i.id !== id);
      saveToLocal(); addLog("DELETE", `Deleted item ${id}`); showToast(`Deleted ${id}`, "success");
      if(currentEditId === id) resetInventoryForm();
      refreshCurrentView();
      modal.remove();
    };
    document.getElementById('cancelDel').onclick = () => modal.remove();
  }

  function refreshCurrentView() {
    const active = document.querySelector('.menu-item.active')?.getAttribute('data-page');
    if(active === 'addInventory' || active === 'updateRecords') showPage('addInventory');
    else if(active === 'dashboard') showPage('dashboard');
    else if(active === 'reportsAnalytics') { loadAnalyticsDashboard(); }
    else if(active === 'activityLogs') renderActivityLogs();
    else if(active === 'settings') renderSettings();
    else renderInventoryTable('inventoryDynamicContainer', currentFilter);
  }

  function resetInventoryForm() {
    document.getElementById('itemName').value = ''; document.getElementById('desc').value = ''; document.getElementById('itemType').value = 'Hardware';
    document.getElementById('entryDate').value = new Date().toISOString().slice(0,10); document.getElementById('quantity').value = 1;
    document.querySelectorAll('input[name="receivedItem"]').forEach(r => { if(r.value === 'Yes') r.checked = true; });
    document.getElementById('priorityLevel').value = 'Medium'; document.getElementById('vendorName').value = ''; document.getElementById('serialNumber').value = '';
    document.getElementById('departmentAssigned').value = ''; currentEditId = null;
  }

  function loadItemToForm(id) {
    const item = inventoryItems.find(i => i.id === id);
    if(item) {
      document.getElementById('itemName').value = item.name;
      document.getElementById('desc').value = item.description;
      document.getElementById('itemType').value = item.type;
      document.getElementById('entryDate').value = item.entryDate;
      document.getElementById('quantity').value = item.quantity;
      document.querySelector(`input[name="receivedItem"][value="${item.received}"]`).checked = true;
      document.getElementById('priorityLevel').value = item.priority;
      document.getElementById('vendorName').value = item.vendor;
      document.getElementById('serialNumber').value = item.serial;
      document.getElementById('departmentAssigned').value = item.department;
      currentEditId = item.id;
      showToast("Loaded for update", "info");
    }
  }

  function saveInventoryForm() {
    const name = document.getElementById('itemName').value.trim();
    if(!name) { showToast("Item Name required", "error"); return; }
    const type = document.getElementById('itemType').value;
    const qty = parseInt(document.getElementById('quantity').value);
    if(isNaN(qty) || qty<0) { showToast("Invalid quantity", "error"); return; }
    const newItem = {
      id: currentEditId || generateItemId(),
      name: name,
      description: document.getElementById('desc').value,
      type: type,
      entryDate: document.getElementById('entryDate').value,
      quantity: qty,
      received: document.querySelector('input[name="receivedItem"]:checked')?.value,
      priority: document.getElementById('priorityLevel').value,
      vendor: document.getElementById('vendorName').value,
      serial: document.getElementById('serialNumber').value,
      department: document.getElementById('departmentAssigned').value,
    };
    if(currentEditId) {
      const idx = inventoryItems.findIndex(i => i.id === currentEditId);
      if(idx !== -1) inventoryItems[idx] = newItem;
      addLog("UPDATE", `Updated ${newItem.id}`);
      showToast("Updated successfully", "success");
    } else {
      inventoryItems.push(newItem);
      addLog("CREATE", `Added ${newItem.id}`);
      showToast("Inventory added", "success");
    }
    saveToLocal();
    resetInventoryForm();
    refreshCurrentView();
    showPage('addInventory');
  }

  function exportCSV() {
    let csv = "ID,Name,Type,Quantity,Priority,Vendor,Serial,Department\n";
    inventoryItems.forEach(i => { csv += `${i.id},${i.name},${i.type},${i.quantity},${i.priority},${i.vendor},${i.serial},${i.department}\n`; });
    const blob = new Blob([csv], {type: "text/csv"}); const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = "inventory_export.csv"; a.click();
    showToast("CSV Exported", "success");
  }

  // Dashboard stats
  function renderDashboardStats() {
    const total = inventoryItems.length;
    const hw = inventoryItems.filter(i=>i.type==="Hardware").length;
    const sw = inventoryItems.filter(i=>i.type==="Software").length;
    const critical = inventoryItems.filter(i=>i.priority==="Critical").length;
    const healthScore = total ? Math.round(((total-critical)/total)*100) : 100;
    document.getElementById('statTotal').innerText = total;
    document.getElementById('statHw').innerText = hw;
    document.getElementById('statSw').innerText = sw;
    document.getElementById('statCritical').innerText = critical;
    document.getElementById('healthScore').innerText = healthScore+"%";
  }
  function viewItemDetails(id) { const i = inventoryItems.find(x=>x.id===id); alert(`🔍 ${i.name}\nSerial: ${i.serial}\nVendor: ${i.vendor}\nPriority: ${i.priority}`); }
  function renderActivityLogs() { let html=`<div class="glass-card" style="padding:20px;"><h2>🔐 Security & Activity Logs</h2><ul style="max-height:500px; overflow:auto;">`; activityLogs.slice(0,50).forEach(l=>{html+=`<li style="border-bottom:1px solid cyan; padding:10px;">[${new Date(l.timestamp).toLocaleString()}] ${l.action}: ${l.details}</li>`;}); html+=`</ul></div>`; document.getElementById('pageContainer').innerHTML = html; }
  function renderSettings() { document.getElementById('pageContainer').innerHTML = `<div class="glass-card" style="padding:28px;"><h2>🛡️ System Security & Backup</h2><button id="backupDataBtn">Backup Local Data</button> <button id="restoreDemoBtn">Restore Demo Dataset</button><div id="backupMsg"></div></div>`; document.getElementById('backupDataBtn')?.addEventListener('click',()=>{const data=JSON.stringify(inventoryItems); localStorage.setItem('manual_backup',data); showToast("Backup saved","success");}); document.getElementById('restoreDemoBtn')?.addEventListener('click',()=>{initInventory();refreshCurrentView();showToast("Demo restored","success");});}
  
  // ANALYTICS + CHARTS
  let pieChart, barChart, lineChart;
  function loadAnalyticsDashboard() {
    let html = `<div style="display:grid; grid-template-columns:repeat(auto-fit,minmax(280px,1fr)); gap:20px; margin-bottom:30px;">
      <div class="glass-card" style="padding:20px;"><h3>📊 Total Items</h3><div id="statTotalDash">0</div></div>
      <div class="glass-card" style="padding:20px;"><h3>🔧 Hardware/Software</h3><div><span id="hwCount">0</span> HW / <span id="swCount">0</span> SW</div></div>
      <div class="glass-card" style="padding:20px;"><h3>⚠️ Critical Assets</h3><div id="criticalCount">0</div></div>
      <div class="glass-card" style="padding:20px;"><h3>💚 Health Score</h3><div id="healthAnalytic">0%</div></div>
    </div>
    <div class="glass-card" style="padding:20px; margin-bottom:20px;"><canvas id="pieCategoriesChart" height="150"></canvas></div>
    <div class="glass-card" style="padding:20px; margin-bottom:20px;"><canvas id="barQuantitiesChart" height="150"></canvas></div>
    <div class="glass-card" style="padding:20px;"><canvas id="lineTrendChart" height="150"></canvas></div>
    <div style="margin-top:20px;"><button id="downloadReportBtn">📄 Export Report (JSON)</button> <button id="printAnalyticsBtn">🖨️ Print Preview</button></div>`;
    document.getElementById('pageContainer').innerHTML = html;
    const total = inventoryItems.length;
    document.getElementById('statTotalDash').innerText = total;
    const hw = inventoryItems.filter(i=>i.type==="Hardware").length, sw = inventoryItems.filter(i=>i.type==="Software").length;
    document.getElementById('hwCount').innerText = hw; document.getElementById('swCount').innerText = sw;
    const critical = inventoryItems.filter(i=>i.priority==="Critical").length;
    document.getElementById('criticalCount').innerText = critical;
    const health = total?Math.round(((total-critical)/total)*100):100;
    document.getElementById('healthAnalytic').innerText = health+"%";
    // pie: category distribution
    const types = {}; inventoryItems.forEach(i=>types[i.type]=(types[i.type]||0)+1);
    if(pieChart) pieChart.destroy();
    const pieCtx = document.getElementById('pieCategoriesChart').getContext('2d');
    pieChart = new Chart(pieCtx, { type: 'pie', data: { labels: Object.keys(types), datasets: [{ data: Object.values(types), backgroundColor: ['#0ff','#36f','#a55','#5cf','#f5a','#3cf'] }] } });
    const barCtx = document.getElementById('barQuantitiesChart').getContext('2d');
    const topItems = inventoryItems.slice(0,6);
    barChart = new Chart(barCtx, { type: 'bar', data: { labels: topItems.map(i=>i.name), datasets: [{ label: 'Quantity', data: topItems.map(i=>i.quantity), backgroundColor: '#0ff' }] } });
    const monthlyMap = {}; inventoryItems.forEach(i=>{ let m=i.entryDate?.slice(0,7); if(m) monthlyMap[m]=(monthlyMap[m]||0)+1; });
    const lineCtx = document.getElementById('lineTrendChart').getContext('2d');
    lineChart = new Chart(lineCtx, { type: 'line', data: { labels: Object.keys(monthlyMap), datasets: [{ label: 'Entries per month', data: Object.values(monthlyMap), borderColor: 'cyan', tension: 0.3 }] } });
    document.getElementById('downloadReportBtn')?.addEventListener('click',()=>{ const report = { inventory: inventoryItems, analytics:{total, critical, health} }; const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([JSON.stringify(report)],{type:'application/json'})); a.download='cyber_report.json'; a.click(); showToast("Report JSON ready","success"); });
    document.getElementById('printAnalyticsBtn')?.addEventListener('click',()=>window.print());
  }

  function showPage(pageId) {
    const container = document.getElementById('pageContainer');
    if(pageId === 'dashboard') {
      container.innerHTML = `<div style="display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:20px;">
        <div class="glass-card" style="padding:20px"><h3>Total Assets</h3><div id="statTotal" class="counter">0</div></div>
        <div class="glass-card" style="padding:20px"><h3>Hardware</h3><div id="statHw">0</div></div>
        <div class="glass-card" style="padding:20px"><h3>Software</h3><div id="statSw">0</div></div>
        <div class="glass-card" style="padding:20px"><h3>Critical Assets</h3><div id="statCritical">0</div></div>
        <div class="glass-card" style="padding:20px"><h3>Inventory Health</h3><div id="healthScore">0%</div></div>
      </div><div class="glass-card" style="margin-top:30px; padding:20px;"><h2>📋 Recent Items</h2><div id="recentTableContainer"></div></div>`;
      renderDashboardStats();
      renderInventoryTable('recentTableContainer', "");
    } else if(pageId === 'addInventory') {
      container.innerHTML = `<div class="glass-card" style="padding:28px;"><h2><i class="fas fa-microchip"></i> Inventory Manager</h2><form id="inventoryFormFields" class="form-grid" style="margin-top:20px;">
        <input type="text" id="itemName" placeholder="Item Name*"> <textarea id="desc" placeholder="Description"></textarea>
        <select id="itemType">${['Hardware','Software','Network Device','Security Appliance','License','Peripheral','Server Equipment'].map(t=>`<option>${t}</option>`).join('')}</select>
        <input type="date" id="entryDate"> <input type="number" id="quantity" placeholder="Quantity">
        <div><label>Received: </label><label><input type="radio" name="receivedItem" value="Yes" checked> Yes</label> <label><input type="radio" name="receivedItem" value="No"> No</label></div>
        <select id="priorityLevel"><option>Low</option><option>Medium</option><option>High</option><option>Critical</option></select>
        <input id="vendorName" placeholder="Vendor"> <input id="serialNumber" placeholder="Serial Number"> <input id="departmentAssigned" placeholder="Department">
      </form><div style="display:flex; gap:12px; flex-wrap:wrap; margin-top:20px;"><button id="saveBtn">💾 Save Data</button><button id="updateBtn">🔄 Update Data</button><button id="deleteFormBtn">🗑️ Delete Data</button><button id="resetFormBtn">⟳ Reset</button><button id="exportCsvBtn">📎 Export CSV</button><button id="exportJsonBtn">📄 Export JSON</button></div></div>`;
      document.getElementById('saveBtn').onclick = saveInventoryForm;
      document.getElementById('updateBtn').onclick = saveInventoryForm;
      document.getElementById('resetFormBtn').onclick = () => { resetInventoryForm(); currentEditId = null; showToast("Form cleared","info"); };
      document.getElementById('exportCsvBtn').onclick = exportCSV;
      document.getElementById('exportJsonBtn').onclick = () => { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([JSON.stringify(inventoryItems)],{type:'application/json'})); a.download='inventory.json'; a.click(); };
      document.getElementById('deleteFormBtn').onclick = () => { if(currentEditId) deleteItemWithConfirm(currentEditId); else showToast("Select item to delete","error"); };
      resetInventoryForm();
    } else if(pageId === 'reportsAnalytics') loadAnalyticsDashboard();
    else if(pageId === 'activityLogs') renderActivityLogs();
    else if(pageId === 'settings') renderSettings();
    else renderInventoryTable('pageContainer', currentFilter);
    document.querySelectorAll('.menu-item').forEach(m => m.classList.remove('active'));
    document.querySelector(`.menu-item[data-page="${pageId}"]`).classList.add('active');
  }

  // GLOBAL SEARCH
  document.addEventListener('input', (e) => { if(e.target.id === 'globalSearch') { currentFilter = e.target.value.toLowerCase(); refreshCurrentView(); } });

  // AUTH + INIT APP
  function initApp() {
    initInventory();
    const session = sessionStorage.getItem(SESSION_KEY);
    if(session === 'authenticated') { document.getElementById('loginPage').style.display = 'none'; document.getElementById('dashboardApp').style.display = 'block'; showPage('dashboard'); setLiveTime(); }
    else { document.getElementById('loginPage').style.display = 'flex'; document.getElementById('dashboardApp').style.display = 'none'; }
  }
  function setLiveTime() { setInterval(() => { const now = new Date(); document.getElementById('liveDateTime').innerHTML = now.toLocaleString(); }, 1000); }
  document.getElementById('loginForm')?.addEventListener('submit', (e) => { e.preventDefault(); const user = document.getElementById('username').value; const pwd = document.getElementById('password').value; if(user === 'admin' && pwd === 'admin123') { sessionStorage.setItem(SESSION_KEY, 'authenticated'); if(document.getElementById('rememberMe').checked) localStorage.setItem('cyber_remember', 'admin'); initApp(); showToast("Access Granted", "success"); addLog("LOGIN", "Admin logged in"); } else { document.getElementById('loginError').innerText = "INVALID CREDENTIALS ⚠️ Access Denied"; } });
  document.getElementById('togglePwd')?.addEventListener('click', function() { let pwdField = document.getElementById('password'); pwdField.type = pwdField.type === 'password' ? 'text' : 'password'; });
  document.getElementById('logoutBtn')?.addEventListener('click', ()=>{ sessionStorage.removeItem(SESSION_KEY); showToast("Logged out", "info"); location.reload(); });
  document.querySelectorAll('.menu-item[data-page]').forEach(el => el.addEventListener('click', (e) => { showPage(el.getAttribute('data-page')); }));
  initApp();
</script>
</body>
</html>
